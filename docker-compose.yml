services:
  nginx:
    image: nginx:alpine
    container_name: bruskapp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - bruskapp-frontend
      - bruskapp-backend
      - bruskapp-admin
    networks:
      - bruskapp-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: bruskapp-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_DB: bruskapp
      POSTGRES_USER: bruskapp
      POSTGRES_PASSWORD: bruskapp-postgres-pw
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bruskapp-network
    restart: unless-stopped

  bruskapp-frontend:
    build:
      context: ./bruskapp-frontend
      dockerfile: Dockerfile
    container_name: bruskapp-frontend
    expose:
      - "3000"
    networks:
      - bruskapp-network
    restart: unless-stopped

  bruskapp-backend:
    build:
      context: ./bruskapp-backend
      dockerfile: Dockerfile
    container_name: bruskapp-backend
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgresql://bruskapp:bruskapp-postgres-pw@postgres:5432/bruskapp
      JWT_SECRET: DG+BiqBr51psYrdB2eyp91fAhDiEhsGLyH979TVbTT4=
    depends_on:
      postgres:
        condition: service_started
    volumes:
      - backend-data:/app/data
    networks:
      - bruskapp-network
    restart: unless-stopped

  bruskapp-admin:
    build:
      context: ./bruskapp-admin
      dockerfile: Dockerfile
    container_name: bruskapp-admin
    expose:
      - "3000"
    networks:
      - bruskapp-network
    restart: unless-stopped

volumes:
  backend-data:
  pgdata:

networks:
  bruskapp-network:
    driver: bridge